services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: eventra
      MYSQL_USER: eventra
      MYSQL_PASSWORD: eventra
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./eventra_schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      MYSQL_DSN: "eventra:eventra@tcp(db:3306)/eventra?parseTime=true"
      MYSQL_MAX_OPEN_CONNS: "25"
      MYSQL_MAX_IDLE_CONNS: "25"
      MYSQL_CONN_MAX_LIFETIME: "5m"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
